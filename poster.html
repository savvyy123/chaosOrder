<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Poster — order / chaos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 40px 20px;
    }
    .posters {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      justify-content: center;
      align-items: flex-start;
    }
    .posters img {
      max-height: 80vh;
      max-width: 45vw;
      object-fit: contain;
      display: block;
    }
    a#btn-back {
      position: fixed;
      top: 16px;
      left: 16px;
      padding: 6px 14px;
      background: #fff;
      color: #222;
      font-size: 12px;
      font-family: sans-serif;
      border: 1px solid #ccc;
      border-radius: 4px;
      text-decoration: none;
      z-index: 9999;
    }
    a#btn-back:hover { background: #f0f0f0; }
  </style>
</head>
<body>
  <a href="index.html" id="btn-back">← Back</a>
  <div class="posters">
    <img src="sky.png" alt="Sky poster">
    <img src="sea.png" alt="Sea poster">
  </div>
</body>
</html>
